<div class="container mt-3">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-sm">
        <div class="card-header bg-success text-white">
          <h3 class="mb-0"><i class="bi bi-plus-circle"></i> Nouveau Produit</h3>
        </div>
        <div class="card-body">
          @if (errorMessage) {
            <div class="alert alert-danger">{{ errorMessage }}</div>
          }
          <form [formGroup]="productForm" (ngSubmit)="saveProduct()">
            <div class="mb-3">
              <label class="form-label">Nom</label>
              <input type="text" class="form-control" formControlName="name"
                     [class.is-invalid]="invalid('name')">
              @if (invalid('name')) {
                <div class="invalid-feedback">Le nom est obligatoire (3 caractères min).</div>
              }
            </div>
            <div class="mb-3">
              <label class="form-label">Prix (€)</label>
              <input type="number" class="form-control" formControlName="price"
                     [class.is-invalid]="invalid('price')">
              @if (invalid('price')) {
                <div class="invalid-feedback">Le prix doit être supérieur à 0.</div>
              }
            </div>
            <div class="form-check mb-3">
              <input type="checkbox" class="form-check-input" id="selected" formControlName="selected">
              <label class="form-check-label" for="selected">Sélectionné</label>
            </div>
            <button type="submit" class="btn btn-success me-2">
              <i class="bi bi-save"></i> Enregistrer
            </button>
            <button type="button" class="btn btn-outline-secondary" routerLink="/products">
              Annuler
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
